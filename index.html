<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>PDF to Images — Convert PDF Pages to PNG or JPG, Free &amp; Private | S3eidat Tools</title>
<meta name="description" content="Export PDF pages as PNG, JPG or WebP images in your browser. Choose DPI and quality, pick pages, download one by one or all as a zip. Free, no upload.">
<meta property="og:title" content="PDF to Images — free, private PDF to PNG/JPG">
<meta property="og:description" content="Render PDF pages to PNG, JPG or WebP at the DPI you choose. Runs 100% in your browser.">
<meta property="og:image" content="screenshot.png">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="kit/kit.js"></script>
</head>
<body data-tool="pdf-to-images">
<main class="s3-main">
  <section class="s3-hero">
    <h1>PDF to Images</h1>
    <p>Export PDF pages as PNG, JPG or WebP images at the resolution you need. Rendered on your device, never uploaded.</p>
  </section>

  <section class="card">
    <label class="drop" id="drop">
      <input type="file" accept=".pdf,application/pdf" hidden>
      <svg class="i"><use href="#i-upload"/></svg>
      <b>Drop a PDF here</b>
      <span>or click to choose one</span>
    </label>

    <div id="work" hidden>
      <div class="row between pi-file">
        <div class="row"><svg class="i"><use href="#i-file"/></svg><b id="fname"></b><span class="faint" id="fmeta"></span></div>
        <button class="btn ghost small" id="change"><svg class="i"><use href="#i-refresh"/></svg>Another file</button>
      </div>

      <div class="pi-opts mt">
        <div class="field"><span>Format</span>
          <div class="seg" id="fmt" role="group" aria-label="Image format">
            <button aria-pressed="true" data-v="png">PNG</button>
            <button aria-pressed="false" data-v="jpeg">JPG</button>
            <button aria-pressed="false" data-v="webp">WebP</button>
          </div>
        </div>
        <label class="field">Resolution
          <select class="select" id="dpi">
            <option value="72">72 DPI (screen, small)</option>
            <option value="96">96 DPI</option>
            <option value="150" selected>150 DPI (good default)</option>
            <option value="200">200 DPI</option>
            <option value="300">300 DPI (print)</option>
            <option value="600">600 DPI (very large)</option>
          </select>
        </label>
        <label class="field">Pages<input class="input mono" id="range" placeholder="All, or e.g. 1-3, 7" spellcheck="false" inputmode="numeric"></label>
        <label class="field" id="qWrap"><span>Quality: <span id="qVal">90</span>%</span><input type="range" id="quality" min="40" max="100" value="90"></label>
        <label class="check" id="transWrap"><input type="checkbox" id="transparent"> Transparent background</label>
      </div>

      <div class="row mt">
        <span class="chip" id="est"></span>
        <span class="grow"></span>
        <button class="btn" id="cancel" hidden><svg class="i"><use href="#i-x"/></svg>Stop</button>
        <button class="btn primary big" id="go"><svg class="i"><use href="#i-play"/></svg>Convert</button>
      </div>
      <div class="pi-progress mt" id="progWrap" hidden><progress id="prog" max="1" value="0"></progress><span class="faint" id="progText"></span></div>
    </div>
  </section>

  <section class="card mt" id="results" hidden>
    <div class="row between">
      <h2>Images <small id="rcount"></small></h2>
      <button class="btn primary" id="zip"><svg class="i"><use href="#i-download"/></svg>Download all (.zip)</button>
    </div>
    <div class="pi-grid mt" id="grid"></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
